<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKOTA HOURIE - SYSTEM.FAILURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #00ff41;
            text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41;
        }
        @keyframes rainbow-glow {
            0% { border-color: #ff00de; box-shadow: 0 0 10px #ff00de; }
            16% { border-color: #7200ff; box-shadow: 0 0 10px #7200ff; }
            32% { border-color: #007bff; box-shadow: 0 0 10px #007bff; }
            48% { border-color: #00ff41; box-shadow: 0 0 10px #00ff41; }
            64% { border-color: #ffea00; box-shadow: 0 0 10px #ffea00; }
            80% { border-color: #ff7e00; box-shadow: 0 0 10px #ff7e00; }
            100% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        }
        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .terminal {
            border: 2px solid;
            padding: 1.5rem;
            background-color: rgba(0, 10, 0, 0.5);
            animation: rainbow-glow 8s linear infinite alternate;
        }
        #terminal-body {
            height: 400px;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }
        #terminal-body::-webkit-scrollbar {
            display: none; /* Chrome, Safari, and Opera */
        }
        .prompt::before {
            content: 'DH_OS> ';
            color: #00ff41;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.5rem;
            background-color: #fff;
            animation: cursor-blink 1s step-end infinite, rainbow-glow 8s linear infinite alternate;
            box-shadow: 0 0 5px #fff, 0 0 10px #fff;
            margin-left: 4px;
            vertical-align: middle;
        }
        .link {
            text-decoration: underline;
            color: #00ff41;
            cursor: pointer;
        }
        .link:hover {
            background-color: #00ff41;
            color: #000;
            text-shadow: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="terminal" class="terminal w-full max-w-4xl mx-auto">
        <div class="border-b-2 pb-2 mb-4 text-center" style="border-color: inherit;">
            <p>DAKOTA HOURIE -- SYSTEM.FAILURE -- [SESSION_ID: 69420]</p>
        </div>
        <div id="terminal-body" class="text-lg md:text-xl break-words">
            <!-- Content will be typed here by JavaScript -->
        </div>
        <div id="input-line" class="prompt">
            <span id="typed-text"></span><span class="cursor"></span>
        </div>
    </div>
    
    <footer class="text-center mt-6 text-sm">
        <p>// THIS ENTIRE CAMPAIGN IS A BUG, NOT A FEATURE //</p>
        <p class="mt-2">
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="link">[DONATE_TO_THE_VOID]</a>
            <span class="mx-2">|</span>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="link">[JOIN_THE_GLITCH_MOB]</a>
        </p>
    </footer>

    <script>
        const terminalBody = document.getElementById('terminal-body');
        const typedTextElement = document.getElementById('typed-text');
        const inputLine = document.getElementById('input-line');

        const asciiArt = [
            "      .--.          ",
            "     |o_o |         ",
            "     |:_/ |         ",
            "    //   \\ \\      ",
            "   (|     | )       ",
            "  /'\\_   _/`\\     ",
            "  \\___)=(___/      "
        ];
        
        const linesToType = [
            { text: "BOOTING DH_OPERATING_SYSTEM...", speed: 50 },
            { text: "KERNEL_PANIC_LEVEL: FABULOUS", speed: 50 },
            { text: "...", speed: 500 },
            { text: "LOADING CAMPAIGN_MANIFESTO.TXT", speed: 50 },
            { text: "----------------------------------", speed: 20 },
            { text: "CANDIDATE: Dakota Hourie", speed: 40 },
            { text: "STATUS: Independent, Unpredictable", speed: 40 },
            { text: "ALIGNMENT: Longest Ballot Committee (for the chaos)", speed: 40 },
            { text: "PRIMARY_DIRECTIVE: INJECT_GLITTER.EXE", speed: 40 },
            { text: "----------------------------------", speed: 20 },
            { text: " ", speed: 10 },
            { text: "RUNNING PLATFORM.SH:", speed: 50 },
            { text: " ", speed: 10 },
            { text: ">> 1. MANDATE RAINBOWS. All public infrastructure must adhere to a strict 7-color gradient. No exceptions.", speed: 30 },
            { text: ">> 2. REPLACE DEBATES. All political discourse will now be settled via high-stakes vogueing battles.", speed: 30 },
            { text: ">> 3. NATIONALIZE GLITTER. It is a strategic resource. It belongs to the people.", speed: 30 },
            { text: ">> 4. APPOINT A GOOSE. A goose will be given a cabinet position with full veto power. For the drama.", speed: 30 },
            { text: ">> 5. LEGALIZE CHAOS. My entire platform is to make things more confusing, beautiful, and weird.", speed: 30 },
            { text: " ", speed: 10 },
            { text: "LOADING ABOUT_ME.JPG...", speed: 50 },
            { text: "ERROR: IMAGE CORRUPTED. LOADING ASCII FALLBACK...", speed: 50 },
            ...asciiArt.map(line => ({ text: line, speed: 15 })),
            { text: " ", speed: 10 },
            { text: "SYSTEM READY. AWAITING YOUR POOR JUDGEMENT.", speed: 40 },
        ];

        let lineIndex = 0;

        function typeLine() {
            if (lineIndex >= linesToType.length) {
                // Optional: loop back to the start
                // lineIndex = 0; 
                // terminalBody.innerHTML = '';
                // setTimeout(typeLine, 1000);
                inputLine.style.display = 'none'; // Hide cursor line when done
                const endPrompt = document.createElement('div');
                endPrompt.className = 'prompt';
                endPrompt.textContent = 'SESSION_TERMINATED';
                terminalBody.appendChild(endPrompt);
                terminalBody.scrollTop = terminalBody.scrollHeight;
                return;
            }

            const currentLine = linesToType[lineIndex];
            const lineElement = document.createElement('div');
            
            // Add prompt only to lines that aren't part of ASCII art or blank
            if (!currentLine.text.trim().startsWith(' ') && currentLine.text.trim() !== '' && !currentLine.text.includes('.-')) {
                lineElement.className = 'prompt';
            }
            
            terminalBody.appendChild(lineElement);

            let charIndex = 0;
            const typingInterval = setInterval(() => {
                if (charIndex < currentLine.text.length) {
                    lineElement.textContent += currentLine.text[charIndex];
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    lineIndex++;
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    setTimeout(typeLine, currentLine.speed * 2); // Pause before next line
                }
            }, currentLine.speed);
        }

        // Initial blinking cursor before starting
        setTimeout(() => {
            inputLine.style.display = 'none';
            typeLine();
        }, 1000);

    </script>
</body>
</html>
